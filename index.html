<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html{color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>토익 30일 단어장</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=Newsreader:ital,opsz,wght@0,6..72,500;1,6..72,500&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: answer-sheet motif — Day grid like an OMR column index, tests answered by filling bubbles */
:root{
  --bg:#f3f5f7; --paper:#ffffff; --ink:#1d2430; --muted:#5f6b7a; --line:#d9dfe6;
  --accent:#c8314a; --accent-soft:#f8e3e7; --ok:#1f7a4d; --ok-soft:#e1f2e8; --bad:#b3261e; --bad-soft:#fbe4e2;
  --star:#b57f00; --star-soft:#fbf1d6; --known:#4f9a12;
  --pt-n:#2f63c4; --pt-v:#c8314a; --pt-a:#7a4fc0; --pt-ad:#0f8478; --pt-other:#8a6a1c;
  --f-word:"Newsreader",Georgia,"Times New Roman",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161d; --paper:#1a2029; --ink:#e7ebf0; --muted:#97a3b3; --line:#2c3440;
  --accent:#ef6b80; --accent-soft:#3a1f27; --ok:#5cc58d; --ok-soft:#173326; --bad:#f2857c; --bad-soft:#3b1d1b; --star:#f2c14e; --star-soft:#3a3018; --known:#a5e05c; --pt-n:#7fa8f5; --pt-v:#ef6b80; --pt-a:#b896f0; --pt-ad:#4fc7b8; --pt-other:#e0bd62; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161d; --paper:#1a2029; --ink:#e7ebf0; --muted:#97a3b3; --line:#2c3440;
  --accent:#ef6b80; --accent-soft:#3a1f27; --ok:#5cc58d; --ok-soft:#173326; --bad:#f2857c; --bad-soft:#3b1d1b; --star:#f2c14e; --star-soft:#3a3018; --known:#a5e05c; --pt-n:#7fa8f5; --pt-v:#ef6b80; --pt-a:#b896f0; --pt-ad:#4fc7b8; --pt-other:#e0bd62; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
.wrap{max-width:980px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);padding-block:8px 16px}
html{overscroll-behavior-y:none}
/* a flashcard flying off sideways must not widen the page (clip, unlike hidden, keeps sticky headers working) */
html,body{overflow-x:clip}
.list{will-change:transform}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.pin{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hdr,0px));z-index:5;background:var(--bg);padding-bottom:10px;margin-bottom:10px;border-bottom:1px solid var(--line)}
.item{scroll-margin-top:calc(var(--hdr,0px) + var(--pin,0px) + 8px)}
@media (max-width:560px){.hint-long{display:none}}
h1{font-size:1.5rem;margin:0;letter-spacing:-.01em;text-wrap:balance}
h1 small{display:block;font-size:.8rem;font-weight:500;color:var(--muted);letter-spacing:.02em}
nav.tabs{display:flex;gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:4px}
nav.tabs button{border:0;background:none;color:var(--muted);font:inherit;font-weight:500;padding:7px 14px;border-radius:7px;cursor:pointer}
nav.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:8px 14px;border-radius:8px;font-size:.92rem;font-weight:500;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.05)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* Overview */
.summary{display:flex;flex-wrap:wrap;gap:24px;margin:0 0 22px;padding:14px 18px;background:var(--paper);border:1px solid var(--line);border-radius:12px}
.summary div{min-width:0}
.summary b{display:block;font-family:var(--f-mono);font-size:1.25rem}
.summary span{font-size:.8rem;color:var(--muted)}
.group{margin-bottom:22px}
.group h2{font-size:.78rem;letter-spacing:.08em;color:var(--muted);margin:0 0 8px;font-weight:700}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.day{all:unset;box-sizing:border-box;cursor:pointer;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:center}
.day:hover{border-color:var(--accent)}
.day:focus-visible{outline:2px solid var(--accent)}
.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.setcard{all:unset;box-sizing:border-box;cursor:pointer;display:grid;gap:4px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--paper);min-width:0}
.setcard:hover{border-color:var(--accent)}
.setcard:focus-visible{outline:2px solid var(--accent)}
.setno{font-weight:700;color:var(--accent)}
.setrange{font-size:.78rem}
.setwords{font-family:var(--f-word);font-size:.95rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.setmeta{display:flex;justify-content:space-between;gap:8px;font-size:.78rem}
.day .num{grid-row:span 2;font-family:var(--f-mono);font-size:1.2rem;color:var(--accent);width:2.2ch}
.day .t{font-weight:500;font-size:.92rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.day .meta{font-size:.76rem;color:var(--muted);display:flex;gap:8px;align-items:center}
.bar{height:4px;background:var(--line);border-radius:2px;flex:1;overflow:hidden;min-width:30px}
.bar i{display:block;height:100%;background:var(--ok)}

/* Study */
.studyhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.studyhead h2{margin:0;font-size:1.2rem}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--paper)}
.seg button{border:0;background:none;color:var(--muted);padding:7px 12px;font-size:.85rem;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.list{background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.item .i{display:flex;align-items:center;gap:4px}
.grip{border:0;background:none;color:var(--muted);cursor:grab;font-size:1rem;line-height:1;padding:6px 2px;border-radius:4px;touch-action:none}
.grip:hover{color:var(--accent);background:var(--accent-soft)}
.grip:focus-visible{outline:2px solid var(--accent)}
.item.dragging{position:relative;z-index:4;background:var(--paper);box-shadow:0 10px 28px rgba(0,0,0,.18);border-radius:10px}
.item.dragging .grip{cursor:grabbing;color:var(--accent)}
.item{display:grid;grid-template-columns:3.6em minmax(0,1fr) minmax(0,1.3fr) auto;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .i{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.item .w{font-family:var(--f-word);font-size:1.12rem;font-weight:500;white-space:pre-line;min-width:0;overflow-wrap:anywhere}
.item .m{min-width:0;overflow-wrap:anywhere}
.item [data-cell]{cursor:pointer;border-radius:4px;transition:background .12s}
.item [data-cell]:not(.hide):hover{background:var(--accent-soft)}
.item [data-cell]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.item.known .w,.card.known .w{color:var(--known)}
.hide{background:var(--line);color:transparent!important;border-radius:4px;cursor:pointer;user-select:none}
.item.has-ex{cursor:pointer}
.item.has-ex:hover{background:var(--bg)}
.item.has-ex:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.caret{border:0;cursor:pointer;line-height:1.5;display:inline-block;margin-left:8px;font-family:var(--f-body);font-size:.72rem;font-weight:500;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:1px 8px;vertical-align:middle;white-space:nowrap}
.hide .caret{visibility:hidden}
.ex{grid-column:2 / -1;font-size:.84rem;color:var(--muted);white-space:pre-line;background:var(--bg);border-radius:8px;padding:8px 10px}
.icons{display:flex;gap:4px}
.ico{border:1px solid var(--line);background:none;color:var(--muted);border-radius:6px;width:30px;height:30px;cursor:pointer;font-size:.8rem;display:grid;place-items:center}
.ico.star{font-size:.95rem}
.ico.star.on{color:var(--star);border-color:var(--star);background:var(--star-soft)}
.ico.note.has{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.ex.mine{border-left:3px solid var(--accent)}
.editor{grid-column:2 / -1;display:grid;gap:8px;cursor:auto}
.editor textarea{width:100%;font:inherit;font-size:.92rem;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);resize:vertical}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(560px,calc(100% - 32px));background:var(--paper);color:var(--ink);border:1px solid var(--accent);border-radius:12px;padding:14px 16px;box-shadow:0 8px 28px rgba(0,0,0,.18);display:flex;gap:12px;align-items:flex-start;font-size:.9rem;z-index:20}
.toast > div{flex:1;min-width:0}
.ico.pass{cursor:default;border-style:dashed}
.ico.pass.on{background:var(--ok-soft);color:var(--ok);border:1px solid var(--ok)}
@media (max-width:560px){.item{grid-template-columns:3.2em minmax(0,1fr) auto}.item .m{grid-column:2 / 3}.item .icons{grid-row:1 / span 2;grid-column:3}}

/* Flashcard */
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;min-height:280px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px 20px;cursor:pointer;gap:12px;user-select:none;touch-action:pan-y;will-change:transform}
.card.swiping{cursor:grabbing}
.card .w{font-family:var(--f-word);font-size:clamp(2rem,7vw,3.2rem);line-height:1.1;white-space:pre-line;overflow-wrap:anywhere}
.card .m{font-size:1.15rem;max-width:40ch}
.card .hint{font-size:.8rem;color:var(--muted)}
/* the word sits at the same height on both sides of the card; the body below grows downward */
.card{justify-content:flex-start}
.card > .w{margin-top:clamp(24px,7vh,64px)}
.cardbody{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;min-width:0}
.mcols{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;gap:14px 0;width:100%}
.mcol{min-width:0;flex:0 1 auto;max-width:100%;display:grid;gap:6px;text-align:left;padding:2px 26px;border-left:1px solid var(--line)}
.mcol:first-child{border-left:0}
.mcol-h{display:flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;letter-spacing:.04em;color:var(--muted);margin-bottom:2px}
.mcol-v .mcol-h{color:var(--pt-v)} .mcol-n .mcol-h{color:var(--pt-n)} .mcol-a .mcol-h{color:var(--pt-a)} .mcol-ad .mcol-h{color:var(--pt-ad)}
.mcol-i{font-size:1.12rem;line-height:1.35;overflow-wrap:anywhere}
@media (max-width:560px){.mcol{padding:2px 14px}}
.cardnav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-top:12px}

/* Test */
.panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:18px}
.panel h3{margin:0 0 10px;font-size:.95rem}
.field{margin-bottom:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:4px 10px;font-family:var(--f-mono);font-size:.8rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.q{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:22px}
.qtop{display:flex;justify-content:space-between;gap:10px;font-size:.82rem;color:var(--muted);margin-bottom:10px}
.progress{height:4px;background:var(--line);border-radius:2px;margin-bottom:18px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .2s}
.prompt{font-size:1.1rem;margin-bottom:18px;min-height:2.4em;white-space:pre-line;overflow-wrap:anywhere}
.prompt.en{font-family:var(--f-word);font-size:2rem;line-height:1.15}
.opts{display:grid;gap:8px}
.opt{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;overflow-wrap:anywhere}
.opt:hover{border-color:var(--muted)}
.opt:focus-visible{outline:2px solid var(--accent)}
.bub{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--accent);color:var(--accent);display:grid;place-items:center;font-family:var(--f-mono);font-size:.8rem}
.opt .txt{min-width:0}
.opt.en .txt{font-family:var(--f-word);font-size:1.1rem}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .bub{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .bub{background:var(--bad);border-color:var(--bad);color:#fff}
.spell{display:flex;gap:8px;flex-wrap:wrap}
/* part-of-speech markers: small circled abbreviations in front of each meaning */
.mrows{display:grid;gap:3px}
.mrows.inline{display:inline}
.mrow{display:flex;gap:6px;align-items:baseline}
.mrows.inline .mrow{display:inline;margin-right:.5em}
.mrows.inline .pt{margin-right:4px}
.pt{flex:none;display:inline-grid;place-items:center;min-width:1.7em;height:1.7em;padding:0 .35em;border:1.4px solid currentColor;border-radius:999px;font:700 .64rem/1 var(--f-mono);font-style:normal;letter-spacing:0;color:var(--pt-other);position:relative;top:-.08em}
.card .m .mrows{justify-items:start;text-align:left}
.pt-n{color:var(--pt-n)} .pt-v{color:var(--pt-v)} .pt-a{color:var(--pt-a)} .pt-ad{color:var(--pt-ad)}
.hide .pt{visibility:hidden}
.poslabel .pt{vertical-align:.1em;font-size:.62rem}
.posform{display:grid;gap:10px}
.posrow{display:grid;grid-template-columns:5.5em minmax(0,1fr) auto;gap:6px 10px;align-items:center}
.poslabel{font-weight:700;font-size:.85rem;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:6px 8px;text-align:center}
.posrow input{min-width:0;font:inherit;font-size:1.05rem;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.posrow.ok input{border-color:var(--ok);background:var(--ok-soft)}
.posrow.no input{border-color:var(--bad);background:var(--bad-soft)}
.posres{font-weight:700;width:1.2em;text-align:center}
.posrow.ok .posres{color:var(--ok)}
.posrow.no .posres{color:var(--bad)}
.posans{grid-column:2 / -1;font-size:.82rem;color:var(--muted)}
.spell input{flex:1;min-width:0;font-family:var(--f-word);font-size:1.3rem;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.feedback{margin-top:14px;padding:10px 12px;border-radius:8px;font-size:.92rem}
.feedback.ok{background:var(--ok-soft);color:var(--ok)}
.feedback.no{background:var(--bad-soft);color:var(--bad)}
.score{display:flex;flex-wrap:wrap;align-items:baseline;gap:14px;margin-bottom:14px}
.score b{font-family:var(--f-mono);font-size:2.6rem;color:var(--accent)}
table.res{width:100%;border-collapse:collapse;font-size:.9rem}
table.res td{padding:8px 6px;border-top:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}
table.res td.w{font-family:var(--f-word);font-size:1.02rem;width:34%}
.tag{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.empty{padding:28px;text-align:center;color:var(--muted);background:var(--paper);border:1px dashed var(--line);border-radius:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <h1><small>암기 마스터 · 토익 폴더</small>토익 30일 단어장</h1>
    <nav class="tabs" aria-label="메뉴">
      <button id="tab-home" data-tab="home">Day 목록</button>
      <button id="tab-test" data-tab="test">시험</button>
      <button id="tab-wrong" data-tab="wrong">오답노트</button>
    </nav>
  </header>
  <main id="view"></main>
</div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

        firstOrder = false; orderRef = oRef;

function spellings(w) {

    const br = part.match(/^(.*?)(\w+)\[(\w+)\](.*)$/);
    if (br) { out.add(norm(br[1] + br[2] + br[4])); out.add(norm(br[1] + br[3] + br[4])); }
    out.add(norm(part.replace(/\[[^\]]*\]/g, '').replace(/[()]/g, '')));
  }
  return out;
}

    h += `<div class="feedback ${q.ok ? 'ok' : 'no'}">${q.ok ? (q.accepted ? '정답으로 인정했습니다.' : '정답입니다.') : partial ? `품사 ${q.boxOk.length}개 중 ${q.boxOk.filter(Boolean).length}개만 맞았습니다.` : '틀렸습니다.'} <b>${esc(oneLine(q.x.w))}</b> — ${meaningHTML(q.x, true)}
      ${!q.ok && t === 'write' && q.answer.some(Boolean) ? `<div style="margin-top:8px" class="row"><span>입력한 뜻이 모두 맞는 뜻이라면</span><button class="btn" id="accept">정답으로 인정</button></div>` : ''}</div>
      <div class="row" style="margin-top:14px;justify-content:space-between"><button class="btn" id="say">▶ 발음</button><button class="btn primary" id="nextq">${quiz.i + 1 < quiz.qs.length ? '다음 문제 →' : '결과 보기'}</button></div>`;
  } else {
    h += `<div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn" id="quit">그만 보기</button></div>`;
  }
  $view.innerHTML = h + `</div>`;
  const mark = (ans, ok) => {
    q.answer = ans; q.ok = ok;
    // only the writing tests (뜻 쓰기, 철자 쓰기) mark a word known or send a miss to the notebook;
    // a miss in any test un-marks it
    if (ok) { if (TYPED(t)) known.add(q.x.key); }
    else {
      known.delete(q.x.key);
      if (TYPED(t)) { wrong[q.x.key] = (wrong[q.x.key] || 0) + 1; saveWrong(); }
    }
    saveKnown(); renderQuiz();
  };
  if (!done) {
    if (t === 'write') {
      const boxes = [...$view.querySelectorAll('#sf input')];
      boxes[0].focus();
      const submit = give => {
        const vals = boxes.map(b => give ? '' : b.value.trim());
        q.boxOk = q.groups.map(([, parts], j) => !!vals[j] && meaningRight(vals[j], parts));
        mark(vals, q.boxOk.every(Boolean));
      };
      // Enter moves to the next empty box; on the last box (or when all are filled) it grades
      boxes.forEach((b, j) => b.onkeydown = e => {
        if (e.key !== 'Enter') return;
        const next = boxes.slice(j + 1).find(x => !x.value.trim());
        if (next) { e.preventDefault(); next.focus(); }
      });
      $view.querySelector('#sf').onsubmit = e => { e.preventDefault(); if (boxes.some(b => b.value.trim())) submit(false); else boxes[0].focus(); };
      $view.querySelector('#giveup').onclick = () => submit(true);
    } else if (TYPED(t)) {
      const inp = $view.querySelector('#spell-in'); inp.focus();
      $view.querySelector('#sf').onsubmit = e => { e.preventDefault(); if (inp.value.trim()) mark(inp.value.trim(), isRight(inp.value, q.x.w)); };
      $view.querySelector('#giveup').onclick = () => mark('', false);
    } else {
      $view.querySelectorAll('.opt').forEach(b => b.onclick = () => { const j = +b.dataset.j; mark(j, q.opts[j].key === q.x.key); });
    }
    $view.querySelector('#quit').onclick = () => { quiz.qs = quiz.qs.slice(0, quiz.i); quiz.stopped = true; renderResult(); };
  } else {
    $view.querySelector('#say').onclick = () => speak(q.x.w);
    const acc = $view.querySelector('#accept');
    if (acc) acc.onclick = () => {
      // undo the miss recorded a moment ago and count it as correct
      q.ok = true; q.accepted = true; known.add(q.x.key); saveKnown();
      if (wrong[q.x.key] > 1) wrong[q.x.key]--; else delete wrong[q.x.key];
      saveWrong(); renderQuiz();
    };
    const nx = $view.querySelector('#nextq'); nx.focus();
    nx.onclick = () => { quiz.i++; renderQuiz(); };
  }
}
document.addEventListener('keydown', e => {
  if (tab !== 'quiz' || !quiz || /INPUT/.test(e.target.tagName)) return;
  const k = e.key.toUpperCase(), j = 'ABCD'.indexOf(k) >= 0 ? 'ABCD'.indexOf(k) : '1234'.indexOf(k);
  const b = j >= 0 && $view.querySelector(`.opt[data-j="${j}"]:not([disabled])`);
  if (b) { e.preventDefault(); b.click(); }
});
function renderResult() {
  const qs = quiz.qs, right = qs.filter(q => q.ok).length, pct = qs.length ? Math.round(right / qs.length * 100) : 0;
  const st = quiz.set, sk = st && setKey(st.n, st.s, quiz.type);
  // a mock set counts only when finished, not when stopped early with 그만 보기
  const finished = qs.length && !quiz.stopped;
  if (quiz.dayN && qs.length && !quiz.saved) { best[quiz.dayN] = Math.max(best[quiz.dayN] || 0, pct); store.set('best', best); quiz.saved = true; }
  if (st && finished && !quiz.saved) { setBest[sk] = Math.max(setBest[sk] || 0, pct); store.set('setBest', setBest); quiz.saved = true; }
  const misses = qs.filter(q => !q.ok);
  const scoreNote = st ? ` · DAY ${pad(st.n)} 세트 ${st.s + 1}${setBest[sk] != null ? ` 최고 ${setBest[sk]}점` : ''}` : quiz.dayN ? ` · DAY ${pad(quiz.dayN)} 최고 ${best[quiz.dayN]}점` : '';
  let h = `<div class="panel">
    <div class="score"><b>${pct}점</b><span class="muted">${qs.length}문항 중 ${right}개 정답${scoreNote}</span></div>
    <div class="row" style="margin-bottom:16px">
      ${st && st.s + 1 < st.total ? `<button class="btn primary" id="nextset">세트 ${st.s + 2} 시험 →</button>` : ''}
      ${misses.length ? `<button class="btn${st && st.s + 1 < st.total ? '' : ' primary'}" id="retry">틀린 단어만 다시</button>` : ''}
      ${st ? '<button class="btn" id="sameset">이 세트 다시</button>' : ''}
      <button class="btn" id="again">${st ? '세트 목록' : '같은 범위 새 시험'}</button>
      <button class="btn" id="home">Day 목록</button>
    </div>`;
  if (misses.length) {
    h += `<h3>틀린 단어 ${misses.length}개</h3><div style="overflow-x:auto"><table class="res"><tbody>${misses.map(q =>
      `<tr><td class="w">${esc(oneLine(q.x.w))}</td><td>${meaningHTML(q.x)}<div class="tag">DAY ${pad(DAYS[q.x.d].n)}${quiz.type === 'write' && q.answer && q.answer.some(Boolean) ? ` · 입력: ${esc(q.groups.map(([p], j) => `${p} ${q.answer[j] || '—'}${q.boxOk[j] ? ' ✓' : ' ✗'}`).join(' / '))}` : quiz.type === 'spell' && q.answer ? ` · 입력: ${esc(q.answer)}` : ''}</div></td></tr>`).join('')}</tbody></table></div>`;
  } else if (qs.length) h += `<p class="muted">모두 맞혔습니다.</p>`;
  $view.innerHTML = h + `</div>`;
  const r = $view.querySelector('#retry');
  if (r) r.onclick = () => startQuiz(misses.map(q => q.x), quiz.type, 0, null);
  const ns = $view.querySelector('#nextset'), ss = $view.querySelector('#sameset');
  if (ns) ns.onclick = () => startSet(st.n, st.s + 1);
  if (ss) ss.onclick = () => startSet(st.n, st.s);
  $view.querySelector('#again').onclick = () => go('test');
  $view.querySelector('#home').onclick = () => go('home');
}

// ---------- wrong-answer notebook ----------
function renderWrong() {
  const items = Object.entries(wrong).map(([k, c]) => ({ x: ALL.find(y => y.key === k), c })).filter(o => o.x).sort((a, b) => b.c - a.c || a.x.d - b.x.d);
  if (!items.length) { $view.innerHTML = `<div class="empty">뜻 쓰기·철자 쓰기 시험에서 틀린 단어가 여기에 모입니다. 아직 틀린 단어가 없어요.<div class="row" style="justify-content:center;margin-top:12px"><button class="btn primary" id="gotest">시험 보러 가기</button></div></div>`; $view.querySelector('#gotest').onclick = () => go('test'); return; }
  let h = `<div class="studyhead"><h2>오답노트 <span class="muted mono" style="font-size:.9rem">${items.length}단어</span></h2>
    <div class="row"><button class="btn primary" id="wq">오답 시험 (객관식)</button><button class="btn" id="ww">오답 시험 (뜻 쓰기)</button><button class="btn" id="ws">오답 시험 (철자)</button><button class="btn" id="wclear">비우기</button></div></div>
    <div class="list">${items.map((o, i) => `<div class="item"><span class="i">${o.c}회</span><span class="w">${esc(o.x.w)}</span><span class="m">${meaningHTML(o.x)}<div class="tag">DAY ${pad(DAYS[o.x.d].n)}</div></span>
      <span class="icons"><button class="ico" data-say="${i}" aria-label="발음 듣기">▶</button><button class="ico" data-rm="${o.x.key}" aria-label="오답노트에서 빼기" title="오답노트에서 빼기">✕</button></span></div>`).join('')}</div>`;
  $view.innerHTML = h;
  $view.querySelector('#wq').onclick = () => startQuiz(items.map(o => o.x), 'en2ko', 0, null);
  $view.querySelector('#ww').onclick = () => startQuiz(items.map(o => o.x), 'write', 0, null);
  $view.querySelector('#ws').onclick = () => startQuiz(items.map(o => o.x), 'spell', 0, null);
  const clr = $view.querySelector('#wclear');
  clr.onclick = () => {
    if (clr.dataset.armed) { wrong = {}; saveWrong(); renderWrong(); }
    else { clr.dataset.armed = 1; clr.textContent = '한 번 더 누르면 비웁니다'; }
  };
  $view.querySelectorAll('[data-say]').forEach(b => b.onclick = () => speak(items[+b.dataset.say].x.w));
  $view.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { delete wrong[b.dataset.rm]; saveWrong(); renderWrong(); });
}

// ---------- rubber band at the ends of the word list ----------
// Scrolling past the top or bottom stretches the list a little (with growing resistance);
// letting go springs it back with a slight overshoot. Off for reduced-motion viewers.
(() => {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)');
  const MAX = 80;
  const resist = p => Math.sign(p) * MAX * (1 - Math.exp(-Math.abs(p) / (MAX * 1.6)));
  let pull = 0, el = null, timer = 0, touchY = null;
  const atBottom = () => Math.ceil(scrollY + innerHeight) >= document.documentElement.scrollHeight - 1;
  const atTop = () => scrollY <= 0;
  const show = () => { el.style.transition = 'none'; el.style.transform = `translateY(${-resist(pull)}px)`; };
  const release = () => {
    if (!el || !pull) return;
    el.style.transition = 'transform .5s cubic-bezier(.2, 1.45, .35, 1)';
    el.style.transform = '';
    pull = 0;
  };
  function stretch(dy) {
    if (reduce.matches || dragging || (tab !== 'study' && tab !== 'wrong')) return false;
    if (pull) { const np = pull + dy; pull = Math.sign(np) === Math.sign(pull) ? np : 0; show(); return true; }
    if ((dy > 0 && atBottom()) || (dy < 0 && atTop())) {
      el = $view.querySelector('.list');
      if (!el) return false;
      pull = dy; show(); return true;
    }
    return false;
  }
  addEventListener('wheel', e => {
    if (stretch(e.deltaY * 0.6)) { clearTimeout(timer); timer = setTimeout(release, 120); }
  }, { passive: true });
  addEventListener('touchstart', e => { touchY = e.touches[0].clientY; }, { passive: true });
  addEventListener('touchmove', e => {
    if (touchY == null) return;
    const y = e.touches[0].clientY, dy = touchY - y;
    touchY = y;
    stretch(dy);
  }, { passive: true });
  addEventListener('touchend', () => { touchY = null; release(); }, { passive: true });
  addEventListener('touchcancel', () => { touchY = null; release(); }, { passive: true });
})();

go('home');
</script>
